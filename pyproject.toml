[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "retrace"
version = "0.1.0"
description = "Local full-text search, browsing and lifecycle management for Claude Code and Codex CLI session transcripts"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Max Vorobev" }]
keywords = ["claude-code", "codex", "cli", "search", "sqlite", "fts5", "textual", "tui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]

# Pinned exactly, not >=. App.suspend()/restore has regressed across Textual
# minor releases (textualize/textual#5528) and that failure mode wedges the
# user's terminal, which is not something a search tool may do.
dependencies = ["textual==8.2.8"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "textual-dev>=1.7",
]

[project.urls]
Homepage = "https://github.com/vmax/retrace"
Issues = "https://github.com/vmax/retrace/issues"

[project.scripts]
retrace = "retrace.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/retrace"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:retrace.*"]
